<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1万日散歩するやつ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --bright: #39FF14;
    --dark: #1E7A0F;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: var(--bright);
    font-family: 'DotGothic16', sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  #app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #previewCanvas {
    width: 100%;
    aspect-ratio: 1 / 1;
    height: auto;
    display: block;
    border-radius: 20px;
  }
  button {
    font-family: 'DotGothic16', sans-serif;
    font-size: 20px;
    padding: 16px;
    border-radius: 12px;
    border: 2px solid var(--bright);
    background: #000;
    color: var(--bright);
    cursor: pointer;
    width: 100%;
  }
  button.primary {
    background: var(--bright);
    color: #000;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  button.secondary {
    border-color: var(--dark);
    color: var(--dark);
  }
  #settingsLink {
    text-align: center;
    color: var(--dark);
    font-size: 14px;
    text-decoration: underline;
    background: none;
    border: none;
    padding: 4px;
  }
  #settingsPanel {
    display: none;
    flex-direction: column;
    gap: 18px;
    border: 2px solid var(--dark);
    border-radius: 12px;
    padding: 16px;
  }
  #settingsPanel.open { display: flex; }
  #mainScreen {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #app.settingsOpen > #mainScreen { display: none; }
  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .field h3 {
    margin: 0;
    font-size: 16px;
    color: var(--bright);
    font-weight: normal;
  }
  .field p.note {
    margin: 0;
    font-size: 12px;
    color: var(--dark);
  }
  input, textarea {
    font-family: 'DotGothic16', sans-serif;
    background: #000;
    color: var(--bright);
    border: 1px solid var(--dark);
    border-radius: 8px;
    padding: 10px;
    font-size: 16px;
    width: 100%;
  }
  textarea {
    min-height: 100px;
    resize: vertical;
  }
  hr {
    border: none;
    border-top: 1px solid var(--dark);
    width: 100%;
  }
  button.danger {
    border-color: #ff4444;
    color: #ff4444;
  }
</style>
</head>
<body>
<div id="app">
  <div id="mainScreen">
    <canvas id="previewCanvas" width="1080" height="1080"></canvas>
    <button id="btnToday" class="primary"></button>
    <button id="btnYesterday" class="secondary">昨日の分を記録</button>

    <div id="todayStatsSection" class="field" style="display:none;">
      <h3>今日の歩数・距離（任意）</h3>
      <input type="number" id="todayStepsInput" min="0" placeholder="歩数（歩）">
      <input type="number" id="todayDistanceInput" min="0" placeholder="距離（m）">
      <button id="btnSaveTodayStats">保存</button>
    </div>

    <button id="btnShare" class="primary">Xで投稿</button>
    <button id="settingsLink">設定</button>
  </div>

  <div id="settingsPanel">
    <h2 style="margin:0;">設定</h2>

    <div class="field">
      <h3>開始日の変更</h3>
      <input type="date" id="startDateInput">
      <button id="btnSaveStartDate">保存</button>
    </div>

    <hr>

    <div class="field">
      <h3>初期セットアップ</h3>
      <p class="note">開始日から連続で、指定した日数分をまとめて記録済みにします。</p>
      <input type="number" id="initialCountInput" min="0" placeholder="ここまで歩いた回数">
      <button id="btnInitialSetup">登録</button>
    </div>

    <hr>

    <div class="field">
      <h3>最長連続の手動設定</h3>
      <p class="note">実データから計算した最長連続より大きい場合だけ有効になります（記録が追いつくと自動的に上書きされます）。</p>
      <input type="number" id="bestStreakInput" min="0" placeholder="最長連続（日）">
      <button id="btnSaveBestStreak">保存</button>
    </div>

    <hr>

    <div class="field">
      <h3>歩数・距離の記録（日付指定）</h3>
      <p class="note">日付を選ぶと、その日にすでに記録した値が表示されます。空欄で保存するとその項目は未記録になります。</p>
      <input type="date" id="statsDateInput">
      <input type="number" id="statsStepsInput" min="0" placeholder="歩数（歩）">
      <input type="number" id="statsDistanceInput" min="0" placeholder="距離（m）">
      <button id="btnSaveStats">保存</button>
    </div>

    <hr>

    <div class="field">
      <h3>データのエクスポート</h3>
      <button id="btnExport">表示</button>
      <textarea id="exportArea" readonly hidden></textarea>
      <button id="btnCopyExport" hidden>コピー</button>
    </div>

    <hr>

    <div class="field">
      <h3>データのインポート</h3>
      <textarea id="importArea" placeholder="JSONを貼り付け"></textarea>
      <button id="btnImport">読み込む</button>
    </div>

    <hr>

    <div class="field">
      <h3>全データ削除</h3>
      <button id="btnDeleteAll" class="danger">全データ削除</button>
    </div>

    <hr>

    <button id="btnCloseSettings">閉じる</button>
  </div>
</div>

<script>
(() => {
  const STORAGE_KEY = 'walk10000data';
  const BRIGHT = '#39FF14';
  const DARK = '#1E7A0F';
  const UNFILLED_BORDER = '#145A0A';
  const FUTURE = '#0B2A05';

  // Auto-update check: GitHub Pages caches index.html for ~10 minutes, and an
  // iOS home-screen web app often just resumes a suspended page instead of
  // reloading it, so a fresh deploy can otherwise go unseen indefinitely.
  // Every time the app becomes visible, compare the server's Last-Modified
  // (fetched with a cache-busting query so no cache layer can serve a stale
  // answer) against the last one we saw; if it changed, hard-reload.
  const PAGE_STAMP_KEY = 'walk10000_pageStamp';
  async function checkForUpdate() {
    try {
      const res = await fetch(location.pathname + '?_cb=' + Date.now(), {
        method: 'HEAD',
        cache: 'no-store',
      });
      const stamp = res.headers.get('last-modified') || res.headers.get('etag');
      if (!stamp) return;
      const prev = localStorage.getItem(PAGE_STAMP_KEY);
      if (prev && prev !== stamp) {
        localStorage.setItem(PAGE_STAMP_KEY, stamp);
        location.replace(location.pathname + '?v=' + Date.now());
        return;
      }
      localStorage.setItem(PAGE_STAMP_KEY, stamp);
    } catch (e) {
      // offline or request failed; keep showing the cached page
    }
  }
  checkForUpdate();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForUpdate();
  });
  window.addEventListener('pageshow', () => checkForUpdate());

  function todayStr() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function parseDateStr(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function formatDateStr(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function addDays(s, n) {
    const d = parseDateStr(s);
    d.setDate(d.getDate() + n);
    return formatDateStr(d);
  }

  function dotDate(s) {
    return s.replace(/-/g, '.');
  }

  function defaultData() {
    return { startDate: todayStr(), walkedDates: [], dailyStats: {} };
  }

  function normalizeData(parsed) {
    if (!parsed.dailyStats || typeof parsed.dailyStats !== 'object') {
      parsed.dailyStats = {};
    }
    return parsed;
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultData();
      const parsed = JSON.parse(raw);
      if (!parsed.startDate || !Array.isArray(parsed.walkedDates)) return defaultData();
      return normalizeData(parsed);
    } catch (e) {
      return defaultData();
    }
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  let data = loadData();

  function computeDerived() {
    const n = data.walkedDates.length;
    const cardNumber = n === 0 ? 1 : Math.floor((n - 1) / 100) + 1;
    const filledInCard = n - (cardNumber - 1) * 100;

    const set = new Set(data.walkedDates);
    const sorted = [...data.walkedDates].sort();
    let longest = 0, current = 0, prev = null;
    for (const d of sorted) {
      if (prev && (parseDateStr(d) - parseDateStr(prev)) / 86400000 === 1) {
        current += 1;
      } else {
        current = 1;
      }
      longest = Math.max(longest, current);
      prev = d;
    }
    longest = Math.max(longest, data.bestStreakOverride || 0);

    const today = todayStr();
    const yesterday = addDays(today, -1);
    let streak = 0;
    let anchor = null;
    if (set.has(today)) anchor = today;
    else if (set.has(yesterday)) anchor = yesterday;
    if (anchor) {
      streak = 1;
      let cursor = addDays(anchor, -1);
      while (set.has(cursor)) {
        streak++;
        cursor = addDays(cursor, -1);
      }
    }

    return { n, cardNumber, filledInCard, streak, longest, today, yesterday, todayWalked: set.has(today) };
  }

  function computeStatsTotals() {
    let totalSteps = 0, totalDistanceM = 0, hasSteps = false, hasDistance = false;
    for (const key in data.dailyStats) {
      const s = data.dailyStats[key];
      if (s.steps != null) { totalSteps += s.steps; hasSteps = true; }
      if (s.distanceM != null) { totalDistanceM += s.distanceM; hasDistance = true; }
    }
    return { totalSteps, totalDistanceM, hasSteps, hasDistance };
  }

  function formatStatLine(steps, distanceM) {
    const parts = [];
    if (steps != null) parts.push(`${steps}歩`);
    if (distanceM != null) parts.push(`${(distanceM / 1000).toFixed(1)}km`);
    return parts.join(' / ');
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawLargeGrid(ctx, x, y, filled) {
    const cell = 44, gap = 12;
    for (let i = 0; i < 100; i++) {
      const row = Math.floor(i / 10), col = i % 10;
      const cx = x + col * (cell + gap);
      const cy = y + row * (cell + gap);
      if (i < filled) {
        ctx.fillStyle = BRIGHT;
        ctx.fillRect(cx, cy, cell, cell);
      } else {
        ctx.strokeStyle = UNFILLED_BORDER;
        ctx.lineWidth = 3;
        ctx.strokeRect(cx + 1.5, cy + 1.5, cell - 3, cell - 3);
      }
    }
    return { width: cell * 10 + gap * 9, height: cell * 10 + gap * 9 };
  }

  function drawSmallGrid(ctx, x, y, currentIndex0) {
    const cell = 26, gap = 8;
    let currentCellRect = null;
    for (let i = 0; i < 100; i++) {
      const row = Math.floor(i / 10), col = i % 10;
      const cx = x + col * (cell + gap);
      const cy = y + row * (cell + gap);
      if (i < currentIndex0) {
        ctx.fillStyle = BRIGHT;
        ctx.fillRect(cx, cy, cell, cell);
      } else if (i === currentIndex0) {
        ctx.fillStyle = BRIGHT;
        ctx.fillRect(cx, cy, cell, cell);
        ctx.strokeStyle = BRIGHT;
        ctx.lineWidth = 2;
        ctx.strokeRect(cx - 2, cy - 2, cell + 4, cell + 4);
        currentCellRect = { x: cx, y: cy, w: cell, h: cell };
      } else {
        ctx.fillStyle = FUTURE;
        ctx.fillRect(cx, cy, cell, cell);
      }
    }
    return { width: cell * 10 + gap * 9, height: cell * 10 + gap * 9, currentCellRect };
  }

  function drawImage(canvas) {
    const ctx = canvas.getContext('2d');
    const W = 1080, H = 1080, MARGIN = 60;
    const derived = computeDerived();

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000';
    roundRectPath(ctx, 0, 0, W, H, 20);
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = BRIGHT;
    roundRectPath(ctx, 3, 3, W - 6, H - 6, 17);
    ctx.stroke();

    ctx.textAlign = 'left';
    let cursorY = MARGIN;

    ctx.textBaseline = 'top';

    // date range: a small header line at the top, ahead of the big day count
    const dateLineFontSize = 28;
    ctx.font = `${dateLineFontSize}px 'DotGothic16'`;
    ctx.fillStyle = BRIGHT;
    ctx.fillText(`${dotDate(data.startDate)} → ${dotDate(derived.today)}`, MARGIN, cursorY);
    cursorY += 34 + 16;

    const dayCountBlockTop = cursorY;
    const dayCountBlockHeight = 175;
    const dayLineBaseline = cursorY + 160;
    ctx.textBaseline = 'alphabetic';
    let cx = MARGIN;
    ctx.font = "165px 'DotGothic16'";
    ctx.fillStyle = BRIGHT;
    const nText = String(derived.n);
    ctx.fillText(nText, cx, dayLineBaseline);
    cx += ctx.measureText(nText).width;

    ctx.font = "50px 'DotGothic16'";
    ctx.fillStyle = BRIGHT;
    ctx.fillText(' DAYS', cx, dayLineBaseline);
    cx += ctx.measureText(' DAYS').width;

    ctx.fillText(' / 10000', cx, dayLineBaseline);

    // right column: streak (primary, since it's the most important number to
    // a viewer), then today's/total steps+distance, all right-aligned and
    // top-aligned with the day count
    const todayStats = data.dailyStats[derived.today] || {};
    const totals = computeStatsTotals();
    const todayLine = formatStatLine(todayStats.steps, todayStats.distanceM);
    const totalLine = formatStatLine(
      totals.hasSteps ? totals.totalSteps : null,
      totals.hasDistance ? totals.totalDistanceM : null
    );

    const streakFontSize = 50;
    const streakCaptionSize = 32;
    const streakGap = 10;
    const statsFontSize = 36;
    const statsGap = 6;
    const sectionGap = 16;

    ctx.textBaseline = 'top';
    ctx.textAlign = 'right';
    let ry = dayCountBlockTop;
    ctx.font = `${streakFontSize}px 'DotGothic16'`;
    ctx.fillStyle = BRIGHT;
    ctx.fillText(`連続 ${derived.streak}日`, W - MARGIN, ry);
    ry += streakFontSize + streakGap;
    ctx.font = `${streakCaptionSize}px 'DotGothic16'`;
    ctx.fillText('STREAK', W - MARGIN, ry);
    ry += streakCaptionSize;

    if (todayLine || totalLine) {
      // force below the day-count row entirely (not just below the streak
      // block) so a wide "{n} DAYS / 10000" at 4+ digits never overlaps it
      ry = Math.max(ry, dayCountBlockTop + dayCountBlockHeight) + sectionGap;
      ctx.font = `${statsFontSize}px 'DotGothic16'`;
      if (todayLine) {
        ctx.fillText(`TODAY ${todayLine}`, W - MARGIN, ry);
        ry += statsFontSize + statsGap;
      }
      if (totalLine) {
        ctx.fillText(`TOTAL ${totalLine}`, W - MARGIN, ry);
        ry += statsFontSize;
      }
    }
    ctx.textAlign = 'left';

    cursorY = Math.max(dayCountBlockTop + dayCountBlockHeight, ry) + 34;

    const gridY = cursorY;
    const largeGridWidth = 548;
    const largeGridHeight = 548;
    const largeGridX = W - MARGIN - largeGridWidth;
    const large = drawLargeGrid(ctx, largeGridX, gridY, derived.filledInCard);

    const smallGridX = MARGIN;
    const smallGridY = gridY + Math.round(largeGridHeight * 0.25);
    const small = drawSmallGrid(ctx, smallGridX, smallGridY, derived.cardNumber - 1);

    if (small.currentCellRect) {
      ctx.strokeStyle = DARK;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(small.currentCellRect.x + small.currentCellRect.w, small.currentCellRect.y);
      ctx.lineTo(largeGridX, gridY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(small.currentCellRect.x + small.currentCellRect.w, small.currentCellRect.y + small.currentCellRect.h);
      ctx.lineTo(largeGridX, gridY + large.height);
      ctx.stroke();
    }

    // callouts: a leader line from one block of each grid to what it represents
    const calloutLineLen = 16;
    const calloutGap = 10;
    ctx.font = "38px 'DotGothic16'";
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillStyle = BRIGHT;

    const smallCellSize = 26;
    const smallLineX = smallGridX + smallCellSize / 2;
    const smallLineTop = smallGridY + small.height;
    ctx.strokeStyle = DARK;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(smallLineX, smallLineTop);
    ctx.lineTo(smallLineX, smallLineTop + calloutLineLen);
    ctx.stroke();
    ctx.fillText('100 DAYS', MARGIN, smallLineTop + calloutLineLen + calloutGap);

    const largeCellSize = 44;
    const largeLineX = largeGridX + largeCellSize / 2;
    const largeLineTop = gridY + large.height;
    ctx.strokeStyle = DARK;
    ctx.beginPath();
    ctx.moveTo(largeLineX, largeLineTop);
    ctx.lineTo(largeLineX, largeLineTop + calloutLineLen);
    ctx.stroke();
    ctx.fillStyle = BRIGHT;
    ctx.fillText('1 DAY', largeGridX, largeLineTop + calloutLineLen + calloutGap);

    return derived;
  }

  const canvas = document.getElementById('previewCanvas');
  const btnToday = document.getElementById('btnToday');
  const btnYesterday = document.getElementById('btnYesterday');
  const btnShare = document.getElementById('btnShare');
  const todayStatsSection = document.getElementById('todayStatsSection');
  const todayStepsInput = document.getElementById('todayStepsInput');
  const todayDistanceInput = document.getElementById('todayDistanceInput');

  function render() {
    const derived = drawImage(canvas);
    if (derived.todayWalked) {
      btnToday.textContent = '今日は記録済み';
      btnToday.disabled = true;
    } else {
      btnToday.textContent = '今日歩いた';
      btnToday.disabled = false;
    }
    const set = new Set(data.walkedDates);
    btnYesterday.style.display = set.has(derived.yesterday) ? 'none' : 'block';

    todayStatsSection.style.display = derived.todayWalked ? 'flex' : 'none';
    if (derived.todayWalked) {
      const stats = data.dailyStats[derived.today] || {};
      todayStepsInput.value = stats.steps != null ? stats.steps : '';
      todayDistanceInput.value = stats.distanceM != null ? stats.distanceM : '';
    }
    return derived;
  }

  function recordDate(dateStr) {
    if (!data.walkedDates.includes(dateStr)) {
      data.walkedDates.push(dateStr);
      saveData(data);
    }
    render();
  }

  btnToday.addEventListener('click', () => recordDate(todayStr()));
  btnYesterday.addEventListener('click', () => recordDate(addDays(todayStr(), -1)));

  function setDailyStats(dateStr, steps, distanceM) {
    const entry = {};
    if (steps !== '' && steps != null && !Number.isNaN(steps)) entry.steps = steps;
    if (distanceM !== '' && distanceM != null && !Number.isNaN(distanceM)) entry.distanceM = distanceM;
    if (Object.keys(entry).length === 0) {
      delete data.dailyStats[dateStr];
    } else {
      data.dailyStats[dateStr] = entry;
    }
    saveData(data);
  }

  document.getElementById('btnSaveTodayStats').addEventListener('click', () => {
    const steps = todayStepsInput.value === '' ? null : parseInt(todayStepsInput.value, 10);
    const distanceM = todayDistanceInput.value === '' ? null : parseFloat(todayDistanceInput.value);
    setDailyStats(todayStr(), steps, distanceM);
    alert('保存しました');
  });

  function dataUrlToFile(dataUrl, filename) {
    const [header, base64] = dataUrl.split(',');
    const mime = (header.match(/data:(.*);base64/) || [, 'image/png'])[1];
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new File([bytes], filename, { type: mime });
  }

  btnShare.addEventListener('click', async () => {
    // Build the file synchronously (no canvas.toBlob callback) so navigator.share()
    // fires within the same user-gesture tick as the click; iOS Safari silently
    // rejects share() once that transient activation has expired.
    const derived = computeDerived();
    const file = dataUrlToFile(canvas.toDataURL('image/png'), `walk10000_day${derived.n}.png`);
    const shareText = `【${derived.n}日目 / 10000】\n`;

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], text: shareText });
        return;
      } catch (e) {
        // user cancelled or share failed; fall through to download fallback
      }
    }

    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  });

  // Settings
  const app = document.getElementById('app');
  const settingsPanel = document.getElementById('settingsPanel');
  const settingsLink = document.getElementById('settingsLink');
  const btnCloseSettings = document.getElementById('btnCloseSettings');
  const startDateInput = document.getElementById('startDateInput');
  const bestStreakInput = document.getElementById('bestStreakInput');
  const statsDateInput = document.getElementById('statsDateInput');
  const statsStepsInput = document.getElementById('statsStepsInput');
  const statsDistanceInput = document.getElementById('statsDistanceInput');

  function loadStatsFormFor(dateStr) {
    const stats = data.dailyStats[dateStr] || {};
    statsStepsInput.value = stats.steps != null ? stats.steps : '';
    statsDistanceInput.value = stats.distanceM != null ? stats.distanceM : '';
  }

  function openSettings() {
    startDateInput.value = data.startDate;
    bestStreakInput.value = computeDerived().longest;
    statsDateInput.value = todayStr();
    loadStatsFormFor(todayStr());
    app.classList.add('settingsOpen');
    settingsPanel.classList.add('open');
  }
  function closeSettings() {
    app.classList.remove('settingsOpen');
    settingsPanel.classList.remove('open');
    render();
  }
  settingsLink.addEventListener('click', openSettings);
  btnCloseSettings.addEventListener('click', closeSettings);

  statsDateInput.addEventListener('change', () => {
    if (statsDateInput.value) loadStatsFormFor(statsDateInput.value);
  });

  document.getElementById('btnSaveStats').addEventListener('click', () => {
    const dateStr = statsDateInput.value;
    if (!dateStr) {
      alert('日付を選んでください');
      return;
    }
    const steps = statsStepsInput.value === '' ? null : parseInt(statsStepsInput.value, 10);
    const distanceM = statsDistanceInput.value === '' ? null : parseFloat(statsDistanceInput.value);
    setDailyStats(dateStr, steps, distanceM);
    if (dateStr === todayStr()) render();
    alert('保存しました');
  });

  document.getElementById('btnSaveStartDate').addEventListener('click', () => {
    const v = startDateInput.value;
    if (!v) return;
    data.startDate = v;
    saveData(data);
    alert('開始日を保存しました');
  });

  document.getElementById('btnInitialSetup').addEventListener('click', () => {
    const countInput = document.getElementById('initialCountInput');
    const count = parseInt(countInput.value, 10);
    if (!Number.isFinite(count) || count < 0) {
      alert('正しい日数を入力してください');
      return;
    }
    if (data.walkedDates.length > 0) {
      if (!confirm('既存の記録が上書きされます。よろしいですか？')) return;
    }
    const dates = [];
    for (let i = 0; i < count; i++) {
      dates.push(addDays(data.startDate, i));
    }
    data.walkedDates = dates;
    saveData(data);
    alert('登録しました');
  });

  document.getElementById('btnSaveBestStreak').addEventListener('click', () => {
    const v = parseInt(bestStreakInput.value, 10);
    if (!Number.isFinite(v) || v < 0) {
      alert('正しい日数を入力してください');
      return;
    }
    data.bestStreakOverride = v;
    saveData(data);
    bestStreakInput.value = computeDerived().longest;
    alert('保存しました');
  });

  const exportArea = document.getElementById('exportArea');
  const btnCopyExport = document.getElementById('btnCopyExport');
  document.getElementById('btnExport').addEventListener('click', () => {
    exportArea.value = JSON.stringify(data, null, 2);
    exportArea.hidden = false;
    btnCopyExport.hidden = false;
  });
  btnCopyExport.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(exportArea.value);
      alert('コピーしました');
    } catch (e) {
      exportArea.select();
      document.execCommand('copy');
    }
  });

  document.getElementById('btnImport').addEventListener('click', () => {
    const raw = document.getElementById('importArea').value;
    try {
      const parsed = JSON.parse(raw);
      if (!parsed.startDate || !Array.isArray(parsed.walkedDates)) {
        throw new Error('invalid shape');
      }
      data = normalizeData(parsed);
      saveData(data);
      alert('インポートしました');
    } catch (e) {
      alert('JSONの読み込みに失敗しました');
    }
  });

  document.getElementById('btnDeleteAll').addEventListener('click', () => {
    if (!confirm('全データを削除します。よろしいですか？')) return;
    if (!confirm('本当に削除しますか？この操作は取り消せません。')) return;
    localStorage.removeItem(STORAGE_KEY);
    data = defaultData();
    alert('削除しました');
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(render);
  }
  render();
})();
</script>
</body>
</html>
